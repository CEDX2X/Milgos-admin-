    <!-- Eye (Negative space cutout) -->
    <ellipse cx="5" cy="-11" rx="4" ry="5" fill="#FFFFFF" />
    <circle cx="5.5" cy="-11" r="2.2" fill="#000000" />
  </g>

  <!-- TEXT INSIDE BADGE -->
  <text x="128" y="180" font-family="'Courier New', Courier, monospace, sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="#000000" text-anchor="middle">MILGO'S</text>
